name: Release Launcher

# Releases are produced either manually or by pushing a release tag.
#
# Manual trigger:
#   1. GitHub UI: Actions -> Release Launcher -> Run workflow.
#      A `tag` input is required.
#   2. CLI:
#        gh workflow run release.yml -f tag=v0.1.3
#
# Tag trigger:
#   Pushing a tag matching `v*` (e.g. `git push origin v0.1.3`) starts the
#   workflow with that tag. `github.ref_name` carries the tag name in that
#   case, so the rest of the workflow reads it the same way.
#
# The `tag` input / `github.ref_name` is propagated to downstream steps
# (`assert-release-tag.cjs`, `tauri-action`) so both trigger paths behave
# identically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Pre-create the GitHub release once so the per-platform build jobs can
  # upload their artifacts to it without racing each other. Without this
  # step, two parallel `tauri-action` invocations would both attempt to
  # create the same release and one of them would fail.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror tag to releases repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_REPO_TOKEN }}
          TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          owner='Splicho'
          repo='zemu-launcher-releases'
          if gh release view "$TAG" --repo "$owner/$repo" >/dev/null 2>&1; then
            echo "Release for tag $TAG already exists in $repo - skipping pre-creation."
          else
            echo "No release found for $TAG in $repo - pre-creating it..."
            gh release create "$TAG" \
              --repo "$owner/$repo" \
              --title "Zemu Launcher $TAG" \
              --notes "Release $TAG" \
              --target main
            echo "Release pre-created successfully."
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            cache-key: launcher-windows-x64
            binary-name: zemu-launcher.exe
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage
            cache-key: launcher-linux-x64
            binary-name: zemu-launcher
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache-key }}

      # Tauri on Linux needs a few GTK / WebKit system packages that aren't
      # pre-installed on the runner. Install them before any cargo step so
      # the build can find pkg-config, webkit2gtk-4.1, etc.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify tag matches launcher version
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/assert-release-tag.cjs "${{ inputs.tag || github.ref_name }}"

      - name: Sync generated launcher metadata
        run: pnpm run sync:launcher-config

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          # `--bundles` is interpreted by tauri-action / Tauri's bundler
          # and accepts a per-OS list. We split bundles per platform so
          # the Windows runner doesn't try to build .deb files and the
          # Linux runner doesn't try to build NSIS installers.
          args: --bundles ${{ matrix.bundles }}
          owner: Splicho
          repo: zemu-launcher-releases
          releaseCommitish: main
          tagName: ${{ inputs.tag || github.ref_name }}
          # We pre-create the release in `prepare-release` so the first
          # job to finish doesn't race the second. Telling tauri-action
          # to skip creation keeps both uploads idempotent.
          releaseName: Zemu Launcher ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
