name: Release Launcher

# Releases are produced either manually or by pushing a release tag.
#
# Manual trigger:
#   1. GitHub UI: Actions -> Release Launcher -> Run workflow.
#      A `tag` input is required.
#   2. CLI:
#        gh workflow run release.yml -f tag=v0.1.3
#
# Tag trigger:
#   Pushing a tag matching `v*` (e.g. `git push origin v0.1.3`) starts the
#   workflow with that tag. `github.ref_name` carries the tag name in that
#   case, so the rest of the workflow reads it the same way.
#
# The `tag` input / `github.ref_name` is propagated to downstream steps
# (`assert-release-tag.cjs`, `tauri-action`) so both trigger paths behave
# identically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: launcher-windows-x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify tag matches launcher version
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/assert-release-tag.cjs "${{ inputs.tag || github.ref_name }}"

      - name: Sync generated launcher metadata
        run: pnpm run sync:launcher-config

      - name: Download FreeArc unarc.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # If the binary is already vendored in the repo, verify and skip the download.
          if (Test-Path 'assets\bin\unarc.exe') {
            $size = (Get-Item 'assets\bin\unarc.exe').Length
            Write-Host "Found vendored unarc.exe ($size bytes), skipping download."
          } else {
            $zipPath = Join-Path $env:RUNNER_TEMP 'freeArc-0.666-windows.zip'
            $extractDir = Join-Path $env:RUNNER_TEMP 'freearc-extract'
            if (-not (Test-Path $extractDir)) { New-Item -ItemType Directory -Path $extractDir -Force | Out-Null }
            Write-Host 'Downloading FreeArc 0.666...'

            # SourceForge's "download" endpoint returns an HTML stub that requires a JS redirect.
            # Resolve the real CDN URL via their mirror API, then download that. This avoids the
            # OperationStopped errors you saw from a raw Invoke-WebRequest on the stub page.
            $mirror = Invoke-RestMethod -Uri 'https://sourceforge.net/projects/freearc/best_release.json' -UseBasicParsing
            $url = $mirror.release.url
            Write-Host "Resolved mirror: $url"

            # Use a plain HTTP client so we don't run into IE engine parsing of SourceForge's HTML.
            $client = New-Object System.Net.WebClient
            $client.Headers.Add('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
            $client.Headers.Add('Accept', '*/*')
            $client.DownloadFile($url, $zipPath)

            if (-not (Test-Path $zipPath) -or (Get-Item $zipPath).Length -lt 100KB) {
              throw "FreeArc zip download looks broken (size=$([math]::Round((Get-Item $zipPath).Length/1KB,1)) KB). Got HTML instead of zip?"
            }

            Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
            $unarc = Get-ChildItem -Path $extractDir -Recurse -Filter 'unarc.exe' | Select-Object -First 1
            if (-not $unarc) { throw 'unarc.exe not found in FreeArc archive' }
            New-Item -ItemType Directory -Path 'assets\bin' -Force | Out-Null
            Copy-Item $unarc.FullName 'assets\bin\unarc.exe' -Force
            Write-Host "Installed unarc.exe to assets\bin\ ($((Get-Item 'assets\bin\unarc.exe').Length) bytes)"
          }

          # Sanity-check the binary actually exists before tauri build tries to bundle it.
          if (-not (Test-Path 'assets\bin\unarc.exe')) {
            throw 'unarc.exe is missing from assets\bin\ after install step'
          }
          $hash = (Get-FileHash 'assets\bin\unarc.exe' -Algorithm SHA256).Hash
          Write-Host "unarc.exe sha256: $hash"

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: --bundles nsis
          owner: Splicho
          repo: zemu-launcher-releases
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Zemu Launcher ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
