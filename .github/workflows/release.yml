name: Release Launcher

# Releases are produced either manually or by pushing a release tag.
#
# Manual trigger:
#   1. GitHub UI: Actions -> Release Launcher -> Run workflow.
#      A `tag` input is required.
#   2. CLI:
#        gh workflow run release.yml -f tag=v0.1.3
#
# Tag trigger:
#   Pushing a tag matching `v*` (e.g. `git push origin v0.1.3`) starts the
#   workflow with that tag. `github.ref_name` carries the tag name in that
#   case, so the rest of the workflow reads it the same way.
#
# The `tag` input / `github.ref_name` is propagated to downstream steps
# (`assert-release-tag.cjs`, `tauri-action`) so both trigger paths behave
# identically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: launcher-windows-x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify tag matches launcher version
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: node scripts/assert-release-tag.cjs "${{ inputs.tag || github.ref_name }}"

      - name: Sync generated launcher metadata
        run: pnpm run sync:launcher-config

      - name: Mirror tag to releases repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.tag || github.ref_name }}'
          $owner = 'Splicho'
          $repo = 'zemu-launcher-releases'
          $existing = gh release view $tag --repo "$owner/$repo" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release for tag $tag already exists in $repo - skipping pre-creation."
          } else {
            Write-Host "No release found for $tag in $repo - pre-creating it..."
            gh release create $tag `
              --repo "$owner/$repo" `
              --title "Zemu Launcher $tag" `
              --notes "Release $tag" `
              --target main
            Write-Host "Release pre-created successfully."
          }

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: --bundles nsis
          owner: Splicho
          repo: zemu-launcher-releases
          releaseCommitish: main
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Zemu Launcher ${{ inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
