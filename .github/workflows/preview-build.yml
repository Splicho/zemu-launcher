name: Preview Build

# Builds the launcher with the canonical tauri.conf.json (no override)
# and uploads the resulting installers as workflow artifacts only — no
# GitHub Release, no push to zemu-launcher-releases, no updater
# signing. Use this when you want to try a build without publishing.
#
# Triggers:
#   - Manual: Actions -> Preview Build -> Run workflow.
#   - CLI:    gh workflow run preview-build.yml --ref main
#   - Cron:   03:00 UTC every Sunday (weekly smoke build of main).
#
# The prod release pipeline (`release.yml`) is unchanged.
on:
  schedule:
    # 03:00 UTC every Sunday. Cheap smoke build to catch breakage on
    # main without spamming the actions tab.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            cache-key: preview-windows-x64
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage
            cache-key: preview-linux-x64
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Separate cache namespace from the prod release so this build
          # doesn't evict the release cache and vice versa.
          shared-key: ${{ matrix.cache-key }}

      # Tauri on Linux needs a few GTK / WebKit system packages that
      # aren't pre-installed on the runner. Mirrors release.yml.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Sync generated launcher metadata
        run: pnpm run sync:launcher-config

      # Override the canonical config to disable updater artifact
      # generation, which in turn skips the signing step (the canonical
      # tauri.conf.json has `createUpdaterArtifacts: true` and an
      # updater `pubkey`, so a plain `tauri build` would require
      # TAURI_SIGNING_PRIVATE_KEY). `preview.conf.json` is merged via
      # Tauri v2's JSON Merge Patch (`--config`), so we don't touch
      # tauri.conf.json. The release workflow is unaffected — it sets
      # the signing secrets from `tauri-action` and keeps
      # `createUpdaterArtifacts: true`.
      - name: Build and bundle installers
        run: pnpm tauri build --config src-tauri/preview.conf.json --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zemu-launcher-${{ matrix.platform }}-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error
