name: Nightly Build

# Nightly builds run automatically every day at 03:00 UTC, or can be
# triggered manually from the Actions tab. Installers are attached as
# workflow artifacts only — no GitHub Release, no push to the public
# releases repo. The prod `release.yml` pipeline is unchanged.
#
# To trigger manually from a local checkout:
#   pnpm nightly:trigger               # uses scripts/trigger-nightly.cjs
#   gh workflow run nightly.yml --ref main
on:
  schedule:
    # 03:00 UTC daily. One run per night is plenty for beta QA.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            cache-key: nightly-windows-x64
          - platform: linux
            os: ubuntu-latest
            bundles: deb,appimage
            cache-key: nightly-linux-x64
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Separate cache namespace from prod so the nightly builds
          # don't evict the prod release cache and vice versa.
          shared-key: ${{ matrix.cache-key }}

      # Tauri on Linux needs a few GTK / WebKit system packages that
      # aren't pre-installed on the runner. Mirrors release.yml.
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The canonical tauri.conf.json (and Cargo.toml / launcher.ts)
      # must be in sync with the launcher version. We don't bump
      # versions for nightly builds — the override config supplies the
      # nightly productName/identifier/version on top.
      - name: Sync generated launcher metadata
        run: pnpm run sync:launcher-config

      - name: Build nightly override config
        run: node scripts/build-nightly-config.cjs

      # Tauri's `tauri icon` command (wrapped in scripts/generate-nightly-icons.cjs
      # so this step stays platform-agnostic) pads a non-square source onto a
      # square canvas automatically and produces every variant the bundler
      # reads from `src-tauri/icons/*`.
      - name: Regenerate Tauri icons from icon-nightly.png
        run: node scripts/generate-nightly-icons.cjs

      - name: Build and bundle installers
        # `--config` JSON-merge-patches src-tauri/tauri.nightly.conf.json
        # on top of src-tauri/tauri.conf.json — the canonical config is
        # never mutated.
        run: pnpm tauri build --config src-tauri/tauri.nightly.conf.json --bundles ${{ matrix.bundles }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zemu-launcher-nightly-${{ matrix.platform }}-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error
