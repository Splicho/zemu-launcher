[package]
name = "zemu_launcher"
version = "0.1.3"
description = "Zemu Launcher"
authors = ["Zemu"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zemu_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
discord-rich-presence = "1.1.0"
futures-util = "0.3"
hex = "0.4"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
steamroom = { git = "https://github.com/landaire/steamroom", branch = "main" }
steamroom-client = { git = "https://github.com/landaire/steamroom", branch = "main" }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.0"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
url = "2.5"
walkdir = "2.5"
webbrowser = "1.0"
zip = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
